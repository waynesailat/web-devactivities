<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>GlowKit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: "DM Sans", system-ui, sans-serif;
        }

        .hero-title {
            font-family: "Playfair Display", Georgia, serif;
            font-weight: 800;
            line-height: 1.1;
            color: #1c1917;
        }

        .hero-title em {
            font-style: italic;
            font-weight: 700;
            color: #c8643c;
        }

        h3 {
            font-family: "Playfair Display", Georgia, serif;
            font-weight: 800;
            color: #1c1917;
        }

        .hero {
            background: linear-gradient(135deg, #f8c8dc, #e6b3ff 50%, #b3d9ff);
            min-height: 260px;
        }

        .quote {
            white-space: pre-line;
            font-style: italic;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-body-tertiary">

    <header class="hero d-flex align-items-center justify-content-center text-center p-4">
        <div>
            <h1 class="hero-title display-3">GlowKit Brushes<br />"<em>Your Glow, Your Kit.</em>"</h1>
        </div>
    </header>

    <div class="container py-4">

        <p class="quote text-center text-muted my-4">
            "Every great look begins with the right tool.
            Soft bristles, smooth blends, and a flawless finish.
            Learn what each brush and sponge is made for."
        </p>

        <hr />

        <h5 class="text-center my-4">Brush Categories</h5>
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-5" id="categories"></div>

        <div id="parent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>

        var brushData = [
            {
                category: "Face Brush",
                products: [
                    {
                        name: "Foundation Brush",
                        image: "assets/foundation.jpg",
                        description: "Dense bristles for a smooth, airbrushed foundation finish.",
                    },
                    {
                        name: "Powder Brush",
                        image: "assets/powder.jpg",
                        description: "Extra-soft and wide to dust on setting powder without caking.",
                    },
                    {
                        name: "Angled Blush Brush",
                        image: "assets/blush.jpg",
                        description: "Angled head that follows the cheekbones for blush or contour.",
                    },
                ],
            },
            {
                category: "Eye Brush",
                products: [
                    {
                        name: "Eyeshadow Blending Brush",
                        image: "assets/eyeshadow.jpg",
                        description: "Tapered, fluffy bristles that blur harsh edges into a soft gradient.",
                    },
                    {
                        name: "Eyeliner Brush",
                        image: "assets/eyeliner.jpg",
                        description: "Ultra-thin tip for crisp winged liner and tightlining.",
                    },
                ],
            },
            {
                category: "Sponge",
                products: [
                    {
                        name: "Classic Beauty Sponge",
                        image: "assets/sponge.jpg",
                        description: "Teardrop-shaped, latex-free sponge. Use damp for a dewy blend.",
                    },
                    {
                        name: "Mini Concealer Sponge",
                        image: "assets/mini sponge.jpg",
                        description: "Small pointed tip that reaches under the eyes and around the nose.",
                    },
                ],
            },
            {
                category: "Lip Brush",
                products: [
                    {
                        name: "Lip brush",
                        image: "assets/lipbrush.jpg",
                        description: "Firm bristles for a precise lip line and even color.",
                    },
                ],
            },
        ];

        var Parent = document.getElementById("parent");
        var Categories = document.getElementById("categories");

        for (var i = 0; i < brushData.length; i++) {
            var group = brushData[i];
            var id = group.category.toLowerCase().replace(" ", "-");


            Categories.innerHTML += `
          <a href="#${id}" class="btn btn-outline-dark rounded-pill">
            ${group.category}
          </a>`;


            var htmlContent = `
          <div class="mb-5" id="${id}">
            <h3>${group.category} Collection</h3>
            <hr class="mb-4" />
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        `;


            for (var j = 0; j < group.products.length; j++) {
                var item = group.products[j];

                htmlContent += `
              <div class="col">
                <div class="card p-3 shadow rounded-4 h-100">
                  <img
                    src="${item.image}"
                    alt="${item.name}"
                    class="img-fluid rounded-3 bg-light w-100 object-fit-contain"
                    style="height: 180px"
                    onerror="this.style.visibility='hidden'"
                  />
                  <div class="h5 mt-3 fw-bold">${item.name}</div>
                  <div class="mt-2 fst-italic">${item.description}</div>
                </div>
              </div>
          `;
            }


            htmlContent += `
            </div>
          </div>
        `;

            Parent.innerHTML += htmlContent;
        }
    </script>
</body>

</html>
