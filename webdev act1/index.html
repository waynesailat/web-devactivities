<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0b10">
  <title>Bento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      font-family: Arial, sans-serif;
      --canvas: #35342f;
      --card-black: #d4d4eb;
      --black: #414040da;
      --purple: #f8e384;
      --deep-purple: #e4d5b6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      padding: 10px;
      background: var(--black);
    }

    .dashboard {
      width: min(84vw, 1440px);
      margin-inline: auto;
      padding: clamp(12px, 2vw, 20px);
      overflow: hidden;
      border-radius: 14px;
      background: var(--canvas);
    }

    .card {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 0;
      border-radius: clamp(12px, 1.3vw, 14px);
    }

    .tile-stack {
      display: flex;
      height: min(54vw, calc(100svh - 64px));
      flex-direction: column;
      gap: 12px;
    }

    .left-feature,
    .right-feature {
      flex: 1.35 1 0;
    }

    .left-bottom,
    .right-bottom {
      flex: 1 1 0;
    }

    .dogfood-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dog-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
    }

    .right-pair {
      display: flex;
      min-height: 0;
      flex: 1.9 1 0;
      flex-direction: column;
      gap: 12px;
    }

    .right-pair>.h-50 {
      flex: 1 1 0;
    }

    .right-middle {
      flex: 0.9 1 0;
    }

    .left-feature {
      background: var(--card-black);
    }

    .left-bottom {
      background: var(--purple);
    }

    .center-stack {
      gap: 12px;
    }

    .small-card {
      flex: 1 1 auto;
      background: var(--card-black);
    }

    .center-feature {
      flex: 1.3 1 0;
      background: var(--deep-purple);
    }

    .brand-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .puppy-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .center-bottom {
      flex: 1 1 0;
      background: linear-gradient(to bottom, #211d2c);
    }

    .right-feature {
      background: var(--purple);
    }

    .right-middle {
      background: var(--black);
    }

    .right-bottom {
      background: var(--black);
    }
  </style>
</head>

<body>
  <main class="container-fluid dashboard" aria-label="Blank card layout">
    <section class="row g-3 align-items-stretch" aria-label="Blank cards arranged in aligned columns">
      <div class="col-12 col-lg-3">
        <div class="tile-stack">
          <div class="card left-feature p-1 h-50">
            <img src="assets/dogfood.png" alt="Dog food" class="dogfood-image rounded-3">
          </div>
          <div class="card left-bottom p-1">
            <img class="dog-image" src="assets/dog.png" alt="Dog">
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="tile-stack center-stack">
          <div class="row g-3 center-top">
            <div class="col-6">
              <div class="card small-card p-1 w-100 h-100">
                <div class="p-3 text-center">
                  <h5>Dog Health Care</h5>
                  <img class="img-fluid w-100 h-300" src="assets/tips.png" alt="Dog Care">
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="card small-card p-1 w-100">
                <img class="img-fluid w-100 h-300" src="assets/puppy.png" alt="Puppy" class="puppy-image rounded-3">
              </div>
            </div>
          </div>
          <div class="card center-feature p-1">
            <img src="assets/brand.png" alt="Brand logo" class="brand-logo rounded-3">
          </div>
          <div class="card center-bottom p-1">
            <div class="p-3 text-white">
              <h5>About Bento</h5>
              <p class="mb-0">Your trusted partner in pet nutrition and wellness.</p>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-3">
        <div class="tile-stack" aria-hidden="true">
          <div class="card right-feature p-1">
            <div class="p-3 text-center">
              <h5>Special Offers</h5>
              <p class="mb-0">Get 20% off on premium dog food packs.</p>
            </div>
          </div>
          <div class="right-pair">
            <div class="card right-middle p-1 h-50">
              <div class="p-3 text-white">
                <h6>Customer Reviews</h6>
                <p class="mb-0">“My puppy loves Bento’s food!”</p>
              </div>
            </div>
            <div class="card right-bottom p-1 h-50">
              <div class="p-3 text-white">
                <h6>Contact Us</h6>
                <p class="mb-0"> support@pawganic.com</p>
                <p class="mb-0"> +63 912 345 6789</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
